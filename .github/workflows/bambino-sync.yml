name: bambino-sync

# Full Bambino cycle from the master API, in one job:
#   1. bambino-ingest  — onboard net-new products as DRAFTS (approval-gated; skips
#                        existing, so it's safe to run every cycle).
#   2. bambino-sync    — stock (quantity + in/out), price (regular + active overwrite
#                        discount), missing-at-source, and unarchive-candidate flags
#                        on existing products.
# Bambino spans 9 vendors under one master feed, so the store can't be vendor-
# filtered; each command scopes itself by catalog SKU. Price stays a dry baseline
# until price_live is set.

# Scheduling is centralized in orchestrator.yml (workflow_call). Still hand-runnable.
on:
  workflow_call:
    inputs:
      customer_id:
        type: string
        default: 'maxbaby'
      dry_run:
        type: boolean
        default: false
      sync_prices:
        type: boolean
        default: false
      price_live:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Tenant to tag Axiom events with'
        type: string
        required: true
        default: 'maxbaby'
      dry_run:
        description: 'Plan changes but write nothing'
        type: boolean
        default: true
      sync_prices:
        description: 'Also reconcile prices from the master feed'
        type: boolean
        default: false
      price_live:
        description: 'Write price changes (off = dry baseline)'
        type: boolean
        default: false

# Never let two Bambino cycles overlap (avoids a dedup race double-creating drafts).
concurrency:
  group: bambino-sync-${{ inputs.customer_id || 'maxbaby' }}
  cancel-in-progress: false

jobs:
  bambino-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ".[postgres]"
      - name: Bambino ingest + sync
        env:
          SHOPIFY_STORE_URL: ${{ vars.SHOPIFY_STORE_URL }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_MYSHOPIFY_DOMAIN: ${{ vars.SHOPIFY_MYSHOPIFY_DOMAIN }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          VENDOR_NAME: ${{ vars.VENDOR_NAME }}
          VENDOR_URL: ${{ vars.VENDOR_URL }}
          VENDOR_STORE_TAG: ${{ vars.VENDOR_STORE_TAG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Notifications (new-draft alert) — reuse the same transports as the other passes
          WHATSAPP_API_BASE_URL: ${{ vars.WHATSAPP_API_BASE_URL }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          AXIOM_API_URL: ${{ vars.AXIOM_API_URL }}
          AXIOM_API_TOKEN: ${{ secrets.AXIOM_API_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
        run: |
          # Scheduled runs are live (dry_run=false); manual dispatch defaults to dry.
          CUSTOMER_ID="${{ inputs.customer_id }}"; CUSTOMER_ID="${CUSTOMER_ID:-maxbaby}"
          DRY=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then DRY="--dry-run"; fi

          # 1. Onboard net-new products as drafts (idempotent — skips existing SKUs).
          python -m inventory_sync bambino-ingest --customer-id "$CUSTOMER_ID" $DRY

          # 2. Stock + price + missing-at-source + unarchive flags on existing.
          ARGS="bambino-sync --customer-id $CUSTOMER_ID $DRY"
          if [[ "${{ inputs.sync_prices }}" == "true" ]]; then ARGS="$ARGS --sync-prices"; fi
          if [[ "${{ inputs.price_live }}" == "true" ]]; then ARGS="$ARGS --price-live"; fi
          python -m inventory_sync $ARGS
