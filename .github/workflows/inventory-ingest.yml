name: inventory-ingest

# Digest an uploaded Laura product xlsx into the store: create net-new products
# as DRAFTS (pending dashboard confirmation) and record them in store_products.
# Dispatched by the dashboard upload flow with the blob URL + customer id.

on:
  workflow_dispatch:
    inputs:
      blob_url:
        description: 'URL of the uploaded blob to ingest'
        type: string
        required: true
      customer_id:
        description: 'Tenant the blob belongs to'
        type: string
        required: true
      run_ref:
        description: 'Frontend serial to track this run in ingest_runs (poll by it)'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Parse + group + report what would be created, but write nothing'
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Full-catalog onboarding is ~1h (sequential Shopify REST @ ~3.5s/product).
    # Set high so a one-shot run completes. NOTE: GitHub-hosted runners hard-cap
    # job execution at 6h (360 min) regardless of this value — ample for ~1h.
    timeout-minutes: 600
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ".[postgres]"
      - name: Ingest blob
        env:
          # --- Shopify (create products / collections) ---
          SHOPIFY_STORE_URL: ${{ vars.SHOPIFY_STORE_URL }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          SHOPIFY_MYSHOPIFY_DOMAIN: ${{ vars.SHOPIFY_MYSHOPIFY_DOMAIN }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          # --- Vendor (config load) ---
          VENDOR_NAME: ${{ vars.VENDOR_NAME }}
          VENDOR_URL: ${{ vars.VENDOR_URL }}
          VENDOR_STORE_TAG: ${{ vars.VENDOR_STORE_TAG }}
          # --- Persistent state (Neon) ---
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # --- Notifications (ops alert if the upload is rejected / fails) ---
          WHATSAPP_API_BASE_URL: ${{ vars.WHATSAPP_API_BASE_URL }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          # --- Axiom centralized logging (ingest_* events, customer_id-bound) ---
          AXIOM_API_URL: ${{ vars.AXIOM_API_URL }}
          AXIOM_API_TOKEN: ${{ secrets.AXIOM_API_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
        run: |
          ARGS=(ingest --blob-url "${{ inputs.blob_url }}" --customer-id "${{ inputs.customer_id }}")
          if [[ -n "${{ inputs.run_ref }}" ]]; then ARGS+=(--run-ref "${{ inputs.run_ref }}"); fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then ARGS+=(--dry-run); fi
          python -m inventory_sync "${ARGS[@]}"
